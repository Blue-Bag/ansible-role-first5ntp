---
ntp_daemon: ntpsec
ntp_user: ntpsec
ntp_config_driftfile: /var/lib/ntpsec/ntp.drift

# Modern ntpsec hardening for Debian 12
# We remove 'notrap' and 'nopeer' to stop the CONFIG errors
# Do not use noserve: ntpsec applies it to replies from our own upstream
# servers too, so the clock never syncs (restrict source does not override it
# for 'server' lines). noquery + limited matches the Debian ntpsec default.
ntp_config_restrict:
  - '-4 default kod nomodify noquery limited'
  - '-6 default kod nomodify noquery limited'
  - 'source nomodify noquery'
  - '127.0.0.1'
  - '::1'